[package]
name = "shaco"
version = "0.6.0"
edition = "2021"
description = "A League of Legends wrapper for the LCU REST & WS + the ingame API"
license = "MIT"
documentation = "https://docs.rs/shaco"
readme = "README.md"
homepage = "https://github.com/Leastrio/Shaco"
repository = "https://github.com/Leastrio/Shaco"

[dependencies]
# async
tokio = "1.52.3"
futures-util = "0.3.32"
# async websockets
tokio-tungstenite = { version = "0.29.0", features = ["__rustls-tls"] }
# async http
reqwest = { version = "0.13.3", default-features = false, features = [
    "json",
    "rustls",
] }
# riot auth
riot_local_auth = { git = "https://github.com/FFFFFFFXXXXXXX/riot_local_auth" }
rustls = { version = "0.23.40", default-features = false, features = [
    "aws-lc-rs",
    "std",
    "tls12",
] }
rustls-pemfile = "2.2.0"
# serde
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
derive_more = { version = "2.1.1", features = ["display"] }

[dev-dependencies]
tokio = { version = "1.52.3", features = ["full"] }
